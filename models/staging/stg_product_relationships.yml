models:
  - name: stg_product_relationships
    description: "Staged relationships between products."

    columns:
      - name: id
        description: "Unique identifier for the product relationship."
        tests:
          - not_null
          - unique

      - name: product_id
        description: "Identifier for the parent product."

      - name: child_product_id
        description: "Identifier for the child product."

      - name: quantity
        description: "Quantity of the child product associated with the parent product."

      - name: _updated_at
        description: "Timestamp when the source record was last updated."