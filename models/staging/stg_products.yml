models:
  - name: stg_products
    description: "Staged Confido product records."

    columns:
      - name: id
        description: "Unique identifier for the product."
        tests:
          - not_null
          - unique

      - name: _uuid
        description: "UUID associated with the product."

      - name: upc
        description: "UPC associated with the product."

      - name: name
        description: "Product name."

      - name: product_family_id
        description: "Identifier for the product family."

      - name: cleaned_upc
        description: "Standardized UPC."

      - name: company_detail_id
        description: "Confido company detail identifier."

      - name: type
        description: "Product type."

      - name: item_id
        description: "Identifier for the associated item."

      - name: internal_item_number
        description: "Confido internal item number."

      - name: ship_with_product_relationship_id
        description: "Identifier for the associated ship-with product relationship."

      - name: updated_at
        description: "Timestamp when the product was updated."

      - name: _updated_at
        description: "Timestamp when the source record was last updated."