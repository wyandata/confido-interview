models:
  - name: stg_invoice_items
    description: "Staged invoice line items from the raw Confido invoice items source."

    columns:
      - name: id
        description: "Unique identifier for the invoice line item."
        tests:
          - not_null
          - unique

      - name: invoice_id
        description: "Identifier of the invoice associated with the line item."
        tests:
          - not_null

      - name: total_amount
        description: "Original total amount recorded for the invoice line item."

      - name: quantity
        description: "Original quantity recorded on the invoice line item."

      - name: unit_price
        description: "Original unit price recorded on the invoice line item."

      - name: item_remote_id
        description: "External accounting-system item identifier."

      - name: _updated_at
        description: "Timestamp when the source record was last updated."