models:
  - name: stg_product_shipping_configs
    description: "Staged product shipping configuration records."

    columns:
      - name: product_id
        description: "Identifier for the product."

      - name: shipping_product_id
        description: "Identifier for the product used for shipping."

      - name: global_customer_id
        description: "Global customer associated with the shipping configuration."

      - name: distribution_center_id
        description: "Distribution center associated with the shipping configuration."

      - name: forecast_version_id
        description: "Forecast version associated with the shipping configuration."

      - name: effective_at
        description: "Date on which the shipping configuration becomes effective."

      - name: _updated_at
        description: "Timestamp when the source record was last updated."